<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        
        <!-- What is the customer's name? I must collect this data, and validate it. But what is a valid name? I must decide something. -->
      
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" minlength="2" required>

        <br><br>

        <!-- What is the customer's email? I must make sure the email is valid. Email addresses have a consistent pattern. -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <!-- What colour should this t-shirt be? I must give 3 options. How will I make sure they don't pick other colours? -->

        <label for="colour">Choose a colour:</label>
        <select id="colour" name="colour" required>
            <option value="" selected disabled>Select a colour</option>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="black">Black</option>
        </select>

        <br><br>

        <!-- What size does the customer want? I must give the following 6 options: XS, S, M, L, XL, XXL  -->

        <fieldset>
            <legend>Choose a size:</legend>

            <input type="radio" id="xs" name="size" value="XS" required>
            <label for="xs">XS</label>

            <input type="radio" id="s" name="size" value="S">
            <label for="s">S</label>

            <input type="radio" id="m" name="size" value="M">
            <label for="m">M</label>

            <input type="radio" id="l" name="size" value="L">
            <label for="l">L</label>

            <input type="radio" id="xl" name="size" value="XL">
            <label for="xl">XL</label>

            <input type="radio" id="xxl" name="size" value="XXL">
            <label for="xxl">XXL</label>
        </fieldset>

        <br><br>

        <button type="submit">Submit</button>
    </form>
     
    </main>

    <footer>
      <h2>By Muhammad Bilal</h2>
    </footer>

  </body>
</html>
